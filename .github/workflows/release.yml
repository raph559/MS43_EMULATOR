name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Publish and release (win-x64, linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # One self-contained ms43sim per system, with the standard drives, the licence and the README next to it.
      - name: Publish and zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for rid in win-x64 linux-x64; do
            out="artifacts/MS43Emulator-$TAG-$rid"
            dotnet publish src/Ms43Sim.Cli/Ms43Sim.Cli.csproj -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:DebugType=none -o "$out"
            cp -r drives LICENSE README.md "$out/"
            (cd artifacts && zip -qr "MS43Emulator-$TAG-$rid.zip" "MS43Emulator-$TAG-$rid")
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/MS43Emulator-${{ github.ref_name }}-win-x64.zip
            artifacts/MS43Emulator-${{ github.ref_name }}-linux-x64.zip
          fail_on_unmatched_files: true
