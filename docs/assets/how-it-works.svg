<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">How MS43 Emulator works</title>
  <desc id="d">Your bin becomes the image MS4X Flasher would write. The emulated ECU (C167CR CPU, peripherals and board) runs it, with an engine and car around it driven by a drive file, and a K-line tester speaking DS2. Sixteen checks turn the run into a verdict and a report.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a9bb0"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f28c28"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; }
      .h { font-size: 24px; font-weight: 600; }
      .s { font-size: 17px; fill: #9fb0c3; }
      .g { font-size: 14px; font-weight: 600; fill: #f28c28; letter-spacing: 1.5px; }
      .l { font-size: 15px; fill: #9fb0c3; }
      .box { fill: #1b2633; stroke: #3a4a5c; stroke-width: 1.5; }
      .key { fill: #26211b; stroke: #f28c28; stroke-width: 1.5; }
      .ln { stroke: #8a9bb0; stroke-width: 2; fill: none; }
      .lo { stroke: #f28c28; stroke-width: 2.2; fill: none; }
    </style>
  </defs>
  <rect width="1200" height="640" rx="18" fill="#0f1720"/>

  <!-- input -->
  <rect class="key" x="36" y="150" width="190" height="84" rx="10"/>
  <text class="h" x="131" y="186" text-anchor="middle">Your bin</text>
  <text class="s" x="131" y="210" text-anchor="middle">512 KiB, unmodified</text>

  <rect class="box" x="36" y="290" width="190" height="104" rx="10"/>
  <text class="h" x="131" y="328" text-anchor="middle">Flashed image</text>
  <text class="s" x="131" y="352" text-anchor="middle">as MS4X Flasher</text>
  <text class="s" x="131" y="372" text-anchor="middle">would write it</text>
  <path class="lo" d="M131 234V284" marker-end="url(#o)"/>

  <!-- ECU -->
  <rect x="290" y="40" width="380" height="440" rx="14" fill="none" stroke="#f28c28" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="g" x="312" y="70">THE ECU</text>

  <rect class="box" x="316" y="88" width="328" height="96" rx="10"/>
  <text class="h" x="480" y="124" text-anchor="middle">C167CR CPU</text>
  <text class="s" x="480" y="150" text-anchor="middle">instructions, traps, interrupts,</text>
  <text class="s" x="480" y="170" text-anchor="middle">PEC, cycle-counted timing</text>

  <rect class="box" x="316" y="214" width="328" height="96" rx="10"/>
  <text class="h" x="480" y="250" text-anchor="middle">Peripherals</text>
  <text class="s" x="480" y="276" text-anchor="middle">CAPCOM, timers, ADC, PWM,</text>
  <text class="s" x="480" y="296" text-anchor="middle">SSC, serial, CAN, watchdog</text>

  <rect class="box" x="316" y="340" width="328" height="114" rx="10"/>
  <text class="h" x="480" y="376" text-anchor="middle">Board</text>
  <text class="s" x="480" y="402" text-anchor="middle">EEPROM, output drivers,</text>
  <text class="s" x="480" y="422" text-anchor="middle">monitoring module, key-on</text>

  <path class="ln" d="M480 190V208" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="ln" d="M480 316V334" marker-start="url(#a)" marker-end="url(#a)"/>
  <path class="lo" d="M226 342H284" marker-end="url(#o)"/>

  <!-- world -->
  <rect class="key" x="760" y="40" width="200" height="84" rx="10"/>
  <text class="h" x="860" y="76" text-anchor="middle">Drive file</text>
  <text class="s" x="860" y="100" text-anchor="middle">key, pedal, gears…</text>

  <rect class="box" x="740" y="180" width="424" height="132" rx="10"/>
  <text class="h" x="952" y="216" text-anchor="middle">Engine and car</text>
  <text class="s" x="952" y="242" text-anchor="middle">crank, cams, starter, idle air,</text>
  <text class="s" x="952" y="262" text-anchor="middle">throttle, VANOS, sensors, pedal,</text>
  <text class="s" x="952" y="282" text-anchor="middle">gears, brakes, ASC on CAN</text>
  <path class="lo" d="M860 124V174" marker-end="url(#o)"/>

  <rect class="box" x="740" y="352" width="424" height="96" rx="10"/>
  <text class="h" x="952" y="388" text-anchor="middle">K-line tester</text>
  <text class="s" x="952" y="414" text-anchor="middle">the DS2 session MS43 Tuner speaks</text>

  <path class="ln" d="M650 262H734" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="692" y="250" text-anchor="middle">sensors</text>
  <text class="l" x="692" y="284" text-anchor="middle">outputs</text>
  <path class="ln" d="M650 296H704V400H734" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="l" x="712" y="430">serial</text>

  <!-- results -->
  <path class="lo" d="M480 480V520" marker-end="url(#o)"/>
  <rect class="key" x="316" y="526" width="328" height="84" rx="10"/>
  <text class="h" x="480" y="562" text-anchor="middle">16 checks</text>
  <text class="s" x="480" y="586" text-anchor="middle">pass, fail or incomplete</text>

  <path class="lo" d="M644 568H734" marker-end="url(#o)"/>
  <rect class="box" x="740" y="508" width="424" height="120" rx="10"/>
  <text class="h" x="952" y="544" text-anchor="middle">Report</text>
  <text class="s" x="952" y="570" text-anchor="middle">every spark and injection,</text>
  <text class="s" x="952" y="590" text-anchor="middle">the firmware's variables,</text>
  <text class="s" x="952" y="610" text-anchor="middle">fault memory, EEPROM, K-line log</text>
</svg>
